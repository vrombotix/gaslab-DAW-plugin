name: Build daw-agent
description: Installs the native dependencies, builds the C++ agent and its tests (Release), and installs the agent as the Tauri sidecar.
inputs:
  target:
    description: Rust target triple to build the sidecar for (default the runner's host)
    default: ''
runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libboost-dev lua5.4

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install boost lua

    # vcpkg builds curl + Boost.PropertyTree from source; cache its binary archives.
    - name: Cache vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: vcpkg-x64-windows-static-curl-boost-property-tree

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        vcpkg install curl:x64-windows-static boost-property-tree:x64-windows-static
        echo "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      run: |
        # Intel Mac builds cross-compile on the Apple Silicon runner.
        [ "${{ inputs.target }}" = "x86_64-apple-darwin" ] && CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${CMAKE_ARGS:-}
        cmake --build build --config Release --parallel
        ./scripts/prepare-sidecar.sh ${{ inputs.target }}

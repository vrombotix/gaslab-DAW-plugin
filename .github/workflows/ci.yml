name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the release workflow runs the full suite before building installers

jobs:
  native:
    name: Agent + bridges (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-agent
      - name: Test (C++ unit tests, agent CLI, DAW bridges)
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          # Naming the interpreter makes the Lua bridge tests fail instead of skip.
          LUA: ${{ runner.os == 'Linux' && 'lua5.4' || runner.os == 'macOS' && 'lua' || '' }}

  desktop:
    name: Desktop app (UI + Tauri shell)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # tauri-build refuses to compile without the sidecar binary in place.
      - uses: ./.github/actions/build-agent
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: apps/desktop
      - name: UI tests
        run: npm test
        working-directory: apps/desktop
      - name: Type-check and build the UI
        run: npm run build
        working-directory: apps/desktop
      - name: Tauri shell tests
        run: cargo test
        working-directory: apps/desktop/src-tauri
